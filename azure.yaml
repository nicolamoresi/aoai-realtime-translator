name: aoai-realtime-translator
metadata:
  template: aoai-realtime-translator@1.0.0

services:
  web:
    project: .
    language: js
    host: appservice
    hooks:
      predeploy:
        posix:
          shell: sh
          run: |
            echo "Building app..."
            npm install
            zip -r app.zip * .[^.]* node_modules -x "*.git*" "*.zip"

        windows:
          shell: pwsh
          run: Compress-Archive -Path * -DestinationPath app.zip

infra:
  provider: bicep
  path: infra

hooks:
  postprovision:
    posix:
      shell: sh
      run: sh ./infra/scripts/postprovision.sh   # <<— usa "sh script.sh"
    windows:
      shell: pwsh
      run: ./infra/scripts/postprovision.ps1     # (se in futuro vorrai uno script PS1)
