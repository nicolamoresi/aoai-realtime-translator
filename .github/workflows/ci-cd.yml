name: CI-CD (azd up)

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_ENV_NAME: prod
      AZURE_LOCATION: swedencentral   # consigliata per EU (Realtime support)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (with Service Principal JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup azd
        uses: Azure/setup-azd@v1
        with:
          version: latest

      - name: Provision + Deploy (azd up)
        run: azd up --no-prompt --environment $AZURE_ENV_NAME --location $AZURE_LOCATION
