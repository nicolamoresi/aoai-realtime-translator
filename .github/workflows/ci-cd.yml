name: CI-CD (azd up)

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_ENV_NAME: prod
      AZURE_LOCATION: swedencentral
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install azd manually
        run: |
          curl -fsSL https://aka.ms/install-azd.sh | bash
          azd version

      - name: Authenticate azd with Service Principal
        run: |
          azd auth login \
            --client-id ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }} \
            --client-secret ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }} \
            --tenant-id ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Provision and Deploy with azd
        run: |
          azd env new $AZURE_ENV_NAME --location $AZURE_LOCATION --no-prompt || true
          azd env set AZURE_LOCATION $AZURE_LOCATION
          azd up --no-prompt --environment $AZURE_ENV_NAME
