name: CI-CD (azd up)

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_ENV_NAME: prod
      AZURE_LOCATION: swedencentral   # consigliata per EU (Realtime support)
    steps:
      # 1. Checkout codice
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Installa dipendenze (senza lock file)
      - name: Install dependencies
        run: npm install

      # 4. Login ad Azure con Service Principal (GitHub Secret)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Installa azd manualmente (perché l’action non ha tag stabile)
      - name: Install azd manually
        run: |
          curl -fsSL https://aka.ms/install-azd.sh | bash
          azd version

      # 6. Provision + Deploy (infra + app)
      - name: Provision and Deploy with azd
        run: |
          azd env set AZURE_LOCATION $AZURE_LOCATION
          azd up --no-prompt --environment $AZURE_ENV_NAME
